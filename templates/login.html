<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APQR Pilot - Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { paper: 'var(--apqr-paper)', ink: 'var(--apqr-ink)', hairline: 'var(--apqr-line)', teal: 'var(--apqr-teal)', oos: 'var(--apqr-oos)', faint: 'var(--apqr-mute)' },
  fontFamily: { serif: ['"Source Serif 4"','serif'], sans: ['"IBM Plex Sans"','sans-serif'] }
}}}
</script>
<script>try{var t=localStorage.getItem('apqr-theme')||'dark';document.documentElement.dataset.theme=t;}catch(e){document.documentElement.dataset.theme='dark'}</script>
<link rel="stylesheet" href="{{ url_for('static', filename='apqr.css') }}">
</head>
<body class="bg-paper text-ink font-sans">
<main class="min-h-screen flex items-center justify-center px-6">
  <div class="w-full max-w-sm">
    <h1 class="font-serif text-2xl font-semibold tracking-tight">APQR Pilot</h1>
    <p class="text-faint text-sm mt-1 mb-8">Annual Product Quality Review. Restricted to authorised QA personnel.</p>
    {% if error %}
    <div class="verify-banner fail mb-6">{{ error }}</div>
    {% endif %}
    <form method="post" class="space-y-5">
      <div>
        <label for="username" class="section-label !mb-1">Username</label>
        <input type="text" id="username" name="username" required autocomplete="username" class="field-input">
      </div>
      <div>
        <label for="password" class="section-label !mb-1">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" class="field-input">
      </div>
      <button type="submit" class="btn-primary w-full">Sign in</button>
    </form>
    <p class="text-faint text-xs mt-6">Demo credentials: <code class="font-mono">admin</code> / <code class="font-mono">apqr123</code></p>
  </div>
</main>
</body>
</html>
